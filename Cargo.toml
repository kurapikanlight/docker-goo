[package]
name = "docker-goo"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Linux-first Docker Engine terminal dashboard"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bollard = { version = "0.18.1", features = ["ssl"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
url = "2"
shell-words = "1.1"

[profile.release]
lto = "thin"
strip = true
