name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check installer
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          shellcheck install.sh

      - name: Check release asset contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'docker-goo-linux-\$release_arch' install.sh
          grep -q 'docker-goo-linux-x86_64' INSTALLATION.md
          grep -q 'docker-goo-linux-aarch64' INSTALLATION.md
          grep -q 'docker-goo-linux-armv7' INSTALLATION.md

  build-linux:
    needs: validate
    name: Build ${{ matrix.asset_arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset_arch: x86_64
          - target: aarch64-unknown-linux-musl
            asset_arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            asset_arch: armv7

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build release binary
        run: cargo zigbuild --release --locked --target "${{ matrix.target }}"

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/docker-goo" "dist/docker-goo-linux-${{ matrix.asset_arch }}"
          chmod 0755 "dist/docker-goo-linux-${{ matrix.asset_arch }}"
          file "dist/docker-goo-linux-${{ matrix.asset_arch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-goo-linux-${{ matrix.asset_arch }}
          path: dist/docker-goo-linux-${{ matrix.asset_arch }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docker-goo-linux-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            docker-goo-linux-x86_64 \
            docker-goo-linux-aarch64 \
            docker-goo-linux-armv7 \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/docker-goo-linux-x86_64
            dist/docker-goo-linux-aarch64
            dist/docker-goo-linux-armv7
            dist/SHA256SUMS
